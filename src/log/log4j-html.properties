log4j.rootLogger=trace, stdout, file

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout

# Pattern to output the caller's file name and line number.
log4j.appender.stdout.layout.ConversionPattern=%5p [%t] (%F:%L) - %m%n

# Réglage du niveau de Log pour la console seulement
log4j.appender.stdout.filter.1=org.apache.log4j.varia.LevelRangeFilter
log4j.appender.stdout.filter.1.LevelMin=TRACE
log4j.appender.stdout.filter.1.LevelMax=FATAL
log4j.appender.stdout.filter.1.AcceptOnMatch=true

log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.File=src/log/restaurant-log.html

log4j.appender.file.layout=org.apache.log4j.HTMLLayout
log4j.appender.FILE.layout.Title=HTML Layout Example 
log4j.appender.FILE.layout.LocationInfo=true